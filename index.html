
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleeper Command Center</title>
  
<style>
  :root {
    color-scheme: dark;
    --bg: #101319;
    --surface: #1b2029;
    --border: #303642;
    --text: #f5f6fa;
    --muted: #a0a7b5;
    --accent: #9b91f6;
    --success: #7fc9a4;
  }

  * {
    box-sizing: border-box;
  }

  body {
    width: 100%;
    max-width: 1400px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  h1 {
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.7px;
    margin: 0 0 4px;
  }

  h2 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin: 32px 0 16px;
  }

  p {
    color: var(--muted);
    font-size: 13px;
  }

  button {
    background: #7769df;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: #6658cc;
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  input {
    max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 16px;
  }

  input:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin: 24px 0;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  .number {
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }

  .label {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }

  #status,
  #playerStatus,
  #filterStatus {
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }

  #playerSearch {
    width: 100%;
    margin: 0 0 16px;
  }

  #leagueFilters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  #leagueFilters label {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--muted);
  }

  #leagueFilters input {
    width: auto;
    margin: 0;
    accent-color: var(--accent);
  }

  #playerTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  #playerTable th {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-align: left;
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  #playerTable td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }

  #playerTable tbody tr:hover {
    background: #202632;
  }

  #playerTable button {
    color: var(--accent) !important;
    font-weight: 500;
    font-size: 13px;
    min-height: 36px;
  }

  @media (max-width: 700px) {
    body {
      padding: 18px 14px;
    }

    h1 {
      font-size: 22px;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 16px;
    }

    .number {
      font-size: 26px;
    }

    #loadButton {
      width: 100%;
      min-height: 44px;
    }

    #playerTable {
      min-width: 720px;
    }

    #leagueFilters {
      gap: 8px;
    }

    #leagueFilters label {
      font-size: 12px;
    }
  }

/* Mobile player cards */

#mobilePlayerCards {
  display: none;
}

@media (max-width: 700px) {

  /* Hide the desktop table on mobile */
  #playerTable {
    display: none;
  }

  #mobilePlayerCards {
    display: grid;
    gap: 12px;
    margin-top: 16px;
  }

  .player-card {
    background: #1b2029;
    border: 1px solid #303642;
    border-radius: 14px;
    padding: 16px;
  }

  .player-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 48px;
    padding: 0;
    margin: 0;
    background: transparent;
    text-align: left;
  }

  .player-card-header:hover {
    background: transparent;
  }

  .player-name {
    font-size: 15px;
    font-weight: 600;
    color: #f5f6fa;
  }

  .player-info {
    font-size: 12px;
    color: #a0a7b5;
    margin-top: 3px;
  }

  .player-owned {
    font-size: 20px;
    font-weight: 650;
    color: #f5f6fa;
    text-align: right;
  }

  .player-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 16px;
  }

  .player-stat-label {
    color: #a0a7b5;
    font-size: 11px;
  }

  .player-stat-value {
    font-size: 16px;
    font-weight: 600;
    margin-top: 3px;
  }

  .player-details {
    border-top: 1px solid #303642;
    margin-top: 16px;
    padding-top: 12px;
  }

  .player-league {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    font-size: 12px;
  }

  .player-league-name {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .player-league-status {
    color: #a0a7b5;
    white-space: nowrap;
  }

  .player-league-status.starting {
    color: #7fc9a4;
  }
}


</style>

</head>

<body>
  <h1>Sleeper Command Center</h1>
  <p>Your fantasy football portfolio</p>

  <button id="loadButton">Load My Leagues</button>

  <div class="stats">
    <div class="stat">
      <div class="number" id="leagueCount">--</div>
      <div class="label">Leagues</div>
    </div>

    <div class="stat">
      <div class="number" id="playerCount">--</div>
      <div class="label">Roster Spots</div>
    </div>

    <div class="stat">
      <div class="number" id="starterCount">--</div>
      <div class="label">Starters</div>
    </div>

    <div class="stat">
      <div class="number" id="benchCount">--</div>
      <div class="label">Bench</div>
    </div>
  </div>

  <p id="status">Ready to connect to Sleeper.</p>

<h2>Player Exposure</h2>

<input
  id="playerSearch"
  type="text"
  placeholder="Search for a player..."
  style="width: 95%; padding: 10px; margin-top: 10px;"
>

<p id="playerStatus">
  Load your leagues to see your players.
</p>

<div style="overflow-x: auto;">
  <table
    id="playerTable"
    style="width: 100%; text-align: left; border-collapse: collapse;"
  >

<thead>
  <tr>
    <th>Player</th>
    <th>Position</th>
    <th>Owned</th>
    <th>Start</th>
    <th>Bench</th>
    <th>IR</th>
    <th>Taxi</th>
    <th>Injury</th>
  </tr>
</thead>


    <tbody id="playerTableBody"></tbody>
  </table>
</div>


<!-- Mobile player cards -->
<div id="mobilePlayerCards"></div>


  <script src="app.js"></script>
</body>
</html>
